<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Brain Explorer</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1e293b;
        --muted: #475569;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #eaf2ff, var(--bg) 45%);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .infographic {
        width: min(1100px, 100%);
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.12);
        padding: 1.5rem;
        display: grid;
        gap: 1.5rem;
        grid-template-columns: 2fr 1fr;
      }

      .brain-area {
        background: #f8fbff;
        border-radius: 14px;
        padding: 1rem;
        border: 1px solid #dbe7ff;
      }

      .brain-title {
        margin: 0 0 0.75rem;
        font-weight: 700;
        font-size: clamp(1.2rem, 1.4vw, 1.5rem);
        letter-spacing: 0.01em;
      }

      svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .brain-outline {
        fill: #eff6ff;
        stroke: #93c5fd;
        stroke-width: 3;
      }

      .hotspot {
        fill: var(--accent-soft);
        stroke: var(--accent);
        stroke-width: 2;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .hotspot:hover,
      .hotspot:focus,
      .hotspot.active {
        fill: #93c5fd;
        transform: scale(1.06);
        transform-origin: center;
        outline: none;
      }

      .label {
        font-size: 14px;
        fill: #1d4ed8;
        font-weight: 600;
        pointer-events: none;
      }

      .panel {
        border: 1px solid #dbe7ff;
        border-radius: 14px;
        padding: 1rem;
        background: linear-gradient(180deg, #ffffff, #f8fbff);
      }

      .panel h1 {
        margin: 0;
        font-size: clamp(1.4rem, 1.8vw, 1.8rem);
      }

      .panel p {
        margin: 0.65rem 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .fact {
        margin-top: 1rem;
        border-left: 4px solid var(--accent);
        padding: 0.7rem 0.8rem;
        background: #eff6ff;
        border-radius: 8px;
        font-size: 0.95rem;
      }

      @media (max-width: 900px) {
        .infographic {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="infographic" aria-label="Human Brain Explorer infographic">
        <div class="brain-area">
          <h2 class="brain-title">Interactive Brain Map</h2>
          <svg viewBox="0 0 900 580" role="img" aria-labelledby="brainMapTitle">
            <title id="brainMapTitle">Human brain regions with interactive hotspots</title>
            <path
              class="brain-outline"
              d="M143 304c0-117 95-212 212-212 52 0 100 19 138 50 29-33 72-54 120-54 89 0 162 73 162 162 0 41-15 78-40 106 3 10 4 21 4 31 0 76-62 138-138 138H365c-122 0-222-99-222-221z"
            />

            <circle class="hotspot active" tabindex="0" data-region="frontal" cx="260" cy="250" r="54" aria-label="Frontal lobe" />
            <text class="label" x="225" y="255">Frontal</text>

            <circle class="hotspot" tabindex="0" data-region="parietal" cx="435" cy="180" r="54" aria-label="Parietal lobe" />
            <text class="label" x="397" y="185">Parietal</text>

            <circle class="hotspot" tabindex="0" data-region="temporal" cx="420" cy="360" r="54" aria-label="Temporal lobe" />
            <text class="label" x="381" y="365">Temporal</text>

            <circle class="hotspot" tabindex="0" data-region="occipital" cx="625" cy="260" r="54" aria-label="Occipital lobe" />
            <text class="label" x="585" y="265">Occipital</text>

            <circle class="hotspot" tabindex="0" data-region="cerebellum" cx="670" cy="390" r="48" aria-label="Cerebellum" />
            <text class="label" x="630" y="395">Cerebellum</text>
          </svg>
        </div>

        <aside class="panel" aria-live="polite">
          <h1 id="regionTitle">Frontal Lobe</h1>
          <p id="regionDescription">
            Responsible for executive functions such as planning, decision-making, personality expression, and voluntary motor control.
          </p>
          <div id="regionFact" class="fact">Tip: Click different hotspots to explore each region.</div>
        </aside>
      </section>
    </main>

    <script>
      const regionData = {
        frontal: {
          title: "Frontal Lobe",
          description:
            "Responsible for executive functions such as planning, decision-making, personality expression, and voluntary motor control.",
          fact: "Supports attention control, problem-solving, and speech production."
        },
        parietal: {
          title: "Parietal Lobe",
          description:
            "Processes sensory input including touch, pressure, temperature, and spatial awareness.",
          fact: "Integrates sensory information to help you navigate space and coordinate movement."
        },
        temporal: {
          title: "Temporal Lobe",
          description:
            "Involved in hearing, language comprehension, emotional association, and memory formation.",
          fact: "Contains structures critical for processing sound and creating long-term memories."
        },
        occipital: {
          title: "Occipital Lobe",
          description:
            "Primary visual processing center that interprets color, shape, and motion from visual input.",
          fact: "Turns incoming signals from the eyes into meaningful visual scenes."
        },
        cerebellum: {
          title: "Cerebellum",
          description:
            "Coordinates balance, posture, and fine motor control to produce smooth and accurate movements.",
          fact: "Also contributes to motor learning and timing of complex actions."
        }
      };

      const title = document.getElementById("regionTitle");
      const description = document.getElementById("regionDescription");
      const fact = document.getElementById("regionFact");
      const hotspots = document.querySelectorAll(".hotspot");

      function setActiveRegion(region) {
        const info = regionData[region];
        if (!info) return;

        title.textContent = info.title;
        description.textContent = info.description;
        fact.textContent = info.fact;

        hotspots.forEach((spot) => {
          spot.classList.toggle("active", spot.dataset.region === region);
        });
      }

      hotspots.forEach((spot) => {
        spot.addEventListener("click", () => setActiveRegion(spot.dataset.region));
        spot.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            setActiveRegion(spot.dataset.region);
          }
        });
      });
    </script>
  </body>
</html>
